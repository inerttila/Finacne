# Local only: app always uses the Compose Postgres.
# Live (Render) uses the Dockerfile + DATABASE_URL from the host env (Neon) — not this file.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance
    ports:
      - "5555:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        VITE_HEXCLAVE_PROJECT_ID: ${VITE_HEXCLAVE_PROJECT_ID}
    image: finacne-app:local
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Overrides Neon from .env so `docker compose up` never hits production data.
      DATABASE_URL: postgres://finance:finance@db:5432/finance
      HOST: 0.0.0.0
      PORT: "8080"
      HEXCLAVE_PROJECT_ID: ${HEXCLAVE_PROJECT_ID}
      HEXCLAVE_SECRET_SERVER_KEY: ${HEXCLAVE_SECRET_SERVER_KEY}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
